services:
  - type: web
    name: Student-Result-Analysis-Dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airas-postgres
          property: connectionString
      - key: AIRAS_ALLOWED_EMAILS
        sync: false

databases:
  - name: airas-postgres
    databaseName: airas
    user: airas
    plan: basic-1gb
    region: oregon
